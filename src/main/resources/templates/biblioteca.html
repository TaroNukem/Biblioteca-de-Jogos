<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<a href="index">
    <h1>Games Library</h1>
</a>
<a href="/">Home</a>
<a href="biblioteca">Biblioteca</a>
<div class="jogos biblioteca-jogos">
    <a th:each="jogo: ${biblioteca}" th:href="@{/jogo(nome=${jogo.nome})}">
    <div class="jogo">
        <img class="imagemBiblioteca" th:src="${jogo.imagem}" alt="Imagem do jogo">
        <h3 th:text="${jogo.nome}"></h3>
    </div>
    </a>
</div>
</div>
</body>
</html>
